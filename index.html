<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Meyer - Tech Firm</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background-color: #f8fafc; font-family: 'Inter', sans-serif; overflow-x: hidden; width: 100%; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .bubble-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; pointer-events: none; }
        .bubble { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(59,130,246,0.1) 0%, rgba(59,130,246,0) 70%); animation: float var(--duration) infinite ease-in-out alternate; }
        @keyframes float { 0% { transform: translateY(0px) scale(1); } 100% { transform: translateY(-100px) scale(1.1); } }
        
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.3); }
        .sticky-container { overflow: visible !important; }

        /* Custom Reveal Animation Styles */
        .reveal-blur {
            filter: blur(20px);
            opacity: 0;
            transform: translateY(20px);
            transition: filter 1.2s cubic-bezier(0.22, 1, 0.36, 1), 
                        opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1), 
                        transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .reveal-active {
            filter: blur(0px);
            opacity: 1;
            transform: translateY(0);
        }
    </style>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useRef, useLayoutEffect } = React;

        const flagMap = {
            'es': '🇪🇸', 'en': '🇺🇸', 'fr': '🇫🇷', 'de': '🇩🇪', 'it': '🇮🇹',
            'pt': '🇧🇷', 'zh-CN': '🇨🇳', 'zh-TW': '🇹🇼', 'ja': '🇮🇹', 'ko': '🇰🇷'
        };

        const LanguageFlag = () => {
            const [lang, setLang] = useState('es');
            
            useEffect(() => {
                const htmlNode = document.documentElement;
                const updateLang = () => setLang(htmlNode.getAttribute('lang') || 'es');
                const observer = new MutationObserver(() => updateLang());
                observer.observe(htmlNode, { attributes: true, attributeFilter: ['lang'] });
                updateLang();
                return () => observer.disconnect();
            }, []);
            
            const flag = flagMap[lang.split('-')[0].toLowerCase()] || '🌐';
            
            return (
                <div className="flex items-center justify-center opacity-40 hover:opacity-100 transition-all cursor-help">
                    <span className="text-[11px]">{flag}</span>
                </div>
            );
        };

        const ContentCard = ({ title, desc, align, active, icon }) => {
            return (
                <div className={`flex w-full ${align === 'right' ? 'justify-end' : 'justify-start'} transition-all duration-700 transform ${active ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 translate-y-12 scale-95'}`}>
                    <div className={`max-w-xs md:max-w-sm p-8 rounded-[2.5rem] border bg-white/90 backdrop-blur-md shadow-2xl transition-all duration-500 ${active ? 'border-blue-500 shadow-blue-500/10 scale-105' : 'border-gray-100 shadow-gray-200/40'}`}>
                        <div className={`mb-4 w-12 h-12 rounded-2xl flex items-center justify-center text-2xl ${active ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-400'}`}>
                            {icon}
                        </div>
                        <h3 className="text-xl font-black text-gray-900 mb-2">{title}</h3>
                        <p className="text-sm text-gray-500 font-medium leading-relaxed">{desc}</p>
                    </div>
                </div>
            );
        };

        const CircuitAnimationShowcase = () => {
            const [scrollProgress, setScrollProgress] = useState(0);
            const [pathLength, setPathLength] = useState(0);
            const pathRef = useRef(null);
            const containerRef = useRef(null);

            useLayoutEffect(() => {
                if (pathRef.current) {
                    setPathLength(pathRef.current.getTotalLength());
                }
            }, []);

            useEffect(() => {
                const handleScroll = () => {
                    if (!containerRef.current) return;
                    const rect = containerRef.current.getBoundingClientRect();
                    const totalScrollable = containerRef.current.offsetHeight - window.innerHeight;
                    const progress = Math.max(0, Math.min(1, -rect.top / totalScrollable));
                    setScrollProgress(progress);
                };

                window.addEventListener('scroll', handleScroll, { passive: true });
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const circuitD = "M 300,50 L 300,150 C 300,200 100,200 100,250 L 100,450 C 100,500 500,500 500,550 L 500,750 C 500,800 300,800 300,850 L 300,1000";

            return (
                <section ref={containerRef} className="relative h-[800vh] w-full bg-slate-50/50">
                    <div className="sticky top-0 h-screen w-full flex items-center justify-center pointer-events-none overflow-hidden">
                        <svg viewBox="0 0 600 1100" className="w-full h-[75%] max-w-4xl transition-opacity duration-1000">
                            <path d={circuitD} stroke="#e2e8f0" strokeWidth="6" fill="none" strokeLinecap="round" strokeLinejoin="round" />
                            <path
                                ref={pathRef}
                                d={circuitD}
                                stroke="url(#blueBeam)"
                                strokeWidth="8"
                                fill="none"
                                strokeLinecap="round"
                                strokeLinejoin="round"
                                style={{
                                    strokeDasharray: `160 ${pathLength}`,
                                    strokeDashoffset: pathLength - (scrollProgress * pathLength),
                                    filter: 'drop-shadow(0 0 15px rgba(37, 99, 235, 0.6))'
                                }}
                            />
                            <defs>
                                <linearGradient id="blueBeam" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stopColor="#60a5fa" stopOpacity="0" />
                                    <stop offset="50%" stopColor="#2563eb" stopOpacity="1" />
                                    <stop offset="100%" stopColor="#1d4ed8" stopOpacity="0" />
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>

                    <div className="absolute inset-0 flex flex-col justify-between py-[100vh] z-10 px-6 md:px-20 max-w-6xl mx-auto pointer-events-none">
                        <div className="pointer-events-auto">
                            <ContentCard 
                                icon="⚡" 
                                title="Flujo de Datos" 
                                desc="Transmisión cinética optimizada para infraestructuras críticas sin latencia." 
                                align="left" 
                                active={scrollProgress > 0.03 && scrollProgress < 0.55} 
                            />
                        </div>
                        <div className="pointer-events-auto">
                            <ContentCard 
                                icon="🛡️" 
                                title="Seguridad Zero Trust" 
                                desc="Cifrado de hardware en cada nodo de conexión para integridad total." 
                                align="right" 
                                active={scrollProgress > 0.38 && scrollProgress < 0.68} 
                            />
                        </div>
                        <div className="pointer-events-auto">
                            <ContentCard 
                                icon="📊" 
                                title="Monitoreo Activo" 
                                desc="Seguimiento en tiempo real de voltajes y flujos de información redundante." 
                                align="left" 
                                active={scrollProgress > 0.72 && scrollProgress < 0.98} 
                            />
                        </div>
                    </div>
                </section>
            );
        };

        const SoftwareSection = () => {
            const titleRef = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('reveal-active');
                        }
                    });
                }, { threshold: 0.1 });

                if (titleRef.current) observer.observe(titleRef.current);
                return () => observer.disconnect();
            }, []);

            return (
                <section className="bg-white py-32 px-6 md:px-20 relative z-20 overflow-hidden">
                    <div className="max-w-7xl mx-auto">
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-20 items-center">
                            <div className="order-2 lg:order-1">
                                <h2 
                                    ref={titleRef}
                                    className="text-5xl md:text-7xl font-black text-gray-900 tracking-tighter mb-8 leading-tight reveal-blur"
                                >
                                    Software que <br/>
                                    <span className="text-blue-600">Escala Realidades</span>
                                </h2>
                                <div className="space-y-6 text-lg text-gray-600 leading-relaxed max-w-xl">
                                    <p>
                                        En <span className="font-bold text-gray-900">The Meyer</span>, el desarrollo de software no es solo escribir código; es ingeniería de precisión. Diseñamos ecosistemas digitales robustos que actúan como el sistema nervioso de su empresa.
                                    </p>
                                    <p className="opacity-80">
                                        Desde arquitecturas de microservicios hasta interfaces de usuario de alta fidelidad, nuestras soluciones están construidas para soportar el tráfico global mientras mantienen una latencia mínima y una seguridad impenetrable.
                                    </p>
                                    <div className="pt-6">
                                        <button className="flex items-center gap-3 font-bold text-blue-600 group transition-all">
                                            VER STACK TECNOLÓGICO
                                            <svg className="w-5 h-5 transform group-hover:translate-x-2 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div className="order-1 lg:order-2 relative">
                                <div className="absolute -inset-4 bg-blue-600/5 rounded-[4rem] blur-2xl"></div>
                                <img 
                                    src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&q=80&w=1200" 
                                    alt="Software Development" 
                                    className="relative rounded-[3rem] shadow-2xl object-cover aspect-[4/3] w-full border border-gray-100"
                                    onError={(e) => {
                                        e.target.onerror = null;
                                        e.target.src='https://via.placeholder.com/1200x900?text=Software+Development'
                                    }}
                                />
                                <div className="absolute -bottom-6 -left-6 bg-white p-6 rounded-3xl shadow-xl border border-gray-50 flex items-center gap-4 max-w-[200px]">
                                    <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold">99%</div>
                                    <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest leading-tight">Uptime en despliegues</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const Layout = ({ children }) => {
            return (
                <div className="relative min-h-screen w-full sticky-container">
                    <div className="bubble-bg">
                        <div className="bubble" style={{ width: '300px', height: '300px', left: '10%', '--duration': '15s' }}></div>
                        <div className="bubble" style={{ width: '200px', height: '200px', left: '60%', '--duration': '12s', animationDelay: '2s' }}></div>
                    </div>

                    <div className="fixed top-0 w-full h-10 bg-[#0f172a] z-[60] flex items-center justify-between px-4 md:px-8">
                        <div className="flex items-center space-x-3">
                            <span className="text-[9px] font-bold text-blue-400 tracking-[0.2em]">THE MEYER</span>
                            <LanguageFlag />
                        </div>
                        <div className="hidden md:flex space-x-6 opacity-60">
                            {['ISO 27001', 'ISO 9001', 'PCI DSS'].map((c, i) => (
                                <span key={i} className="text-[9px] font-bold text-white tracking-widest">{c}</span>
                            ))}
                        </div>
                    </div>

                    <nav className="fixed left-0 w-full z-50 px-4 md:px-8 py-4 flex justify-between items-center glass transition-all top-[40px]">
                        <div className="font-black text-2xl tracking-tighter text-slate-900">THE MEYER</div>
                        <div className="hidden md:flex space-x-8 text-sm font-semibold tracking-widest uppercase opacity-60">
                            <a href="#" className="hover:text-blue-600">Hardware</a>
                            <a href="#" className="hover:text-blue-600">Software</a>
                            <a href="#" className="hover:text-blue-600">About US</a>
                        </div>
                        <button className="bg-blue-600 text-white px-6 py-2 rounded-full text-sm font-bold shadow-md hover:bg-blue-700">CONTACTO</button>
                    </nav>

                    <main className="pt-32">{children}</main>

                    <footer className="py-12 border-t border-gray-200 text-center text-gray-400 text-sm font-semibold tracking-widest bg-white relative z-20">
                        &copy; 2026 THE MEYER EU. TODOS LOS DERECHOS RESERVADOS.
                    </footer>
                </div>
            );
        };

        const App = () => {
            useEffect(() => {
                gsap.registerPlugin(ScrollTrigger);
                gsap.from("#hero-content", { duration: 1.5, y: 50, opacity: 0, ease: "power4.out" });
            }, []);

            return (
                <Layout>
                    <section className="min-h-[80vh] flex flex-col items-center justify-center px-4 text-center relative overflow-hidden">
                        <div id="hero-content" className="relative z-10">
                            <div className="inline-block mb-8 px-5 py-1.5 border border-blue-200 text-blue-600 text-[10px] font-bold rounded-full tracking-[0.5em] uppercase bg-blue-50/50">
                                EST. 2026 | TECH FIRM
                            </div>
                            <h1 className="text-6xl md:text-[10rem] font-black text-gray-900 tracking-tighter mb-10 leading-[0.85]">
                                LA NUEVA <br/><span className="text-blue-600">ERA DIGITAL</span>
                            </h1>
                            <p className="text-xl md:text-2xl text-gray-500 max-w-3xl mx-auto mb-16 font-medium">
                                Infraestructura blindada con tecnología de grado industrial.
                            </p>
                            <div className="flex flex-col sm:flex-row items-center justify-center gap-6">
                                <button className="px-10 py-5 bg-blue-600 text-white font-black rounded-full shadow-2xl hover:scale-105 transition-all uppercase tracking-widest text-xs">Explorar Soluciones</button>
                            </div>
                        </div>
                        <div className="absolute bottom-10 animate-bounce opacity-20">
                            <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 14l-7 7-7-7" strokeWidth="3"/></svg>
                        </div>
                    </section>

                    <CircuitAnimationShowcase />

                    <SoftwareSection />

                    <section className="py-40 bg-slate-900 px-4 relative z-20">
                        <div className="max-w-7xl mx-auto text-center">
                            <h3 className="text-4xl md:text-6xl font-black text-white tracking-tighter mb-20">Certificaciones</h3>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-8">
                                {['🛡️ Security', '💎 Quality', '⚙️ Infra', '💳 Finance'].map((item, idx) => (
                                    <div key={idx} className="p-10 bg-slate-800 border border-slate-700 rounded-[3rem] hover:bg-blue-600 transition-all cursor-default">
                                        <div className="text-4xl mb-4">{item.split(' ')[0]}</div>
                                        <div className="text-white font-bold">{item.split(' ')[1]}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>
                </Layout>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
