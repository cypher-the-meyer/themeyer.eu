<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Meyer - About Us</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #ffffff;
            color: #1a202c;
            overflow-x: hidden;
        }

        .bubble-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; overflow: hidden; z-index: 0;
        }
        .bubble {
            position: absolute;
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.15);
            border-radius: 50%;
            bottom: -100px;
            animation: rise var(--duration) infinite ease-in;
        }
        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-110%) scale(1.2); opacity: 0; }
        }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .menu-open #line1 { transform: translateY(8px) rotate(45deg); }
        .menu-open #line2 { opacity: 0; }
        .menu-open #line3 { transform: translateY(-8px) rotate(-45deg); }

        .toggle-dot {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input:checked ~ .toggle-dot {
            transform: translateX(100%);
            background-color: #2563eb;
        }
    </style>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Layout = ({ children }) => {
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const toggleMenu = () => setIsMobileMenuOpen(!isMobileMenuOpen);

            return (
                <div className="relative min-h-screen">
                    {/* Animated Background */}
                    <div className="bubble-bg fixed inset-0 h-screen w-full">
                        <div className="bubble" style={{ width: '300px', height: '300px', left: '10%', '--duration': '15s' }}></div>
                        <div className="bubble" style={{ width: '200px', height: '200px', left: '60%', '--duration': '12s', animationDelay: '2s' }}></div>
                        <div className="bubble" style={{ width: '150px', height: '150px', left: '30%', '--duration': '18s', animationDelay: '5s' }}></div>
                        <div className="bubble" style={{ width: '100px', height: '100px', left: '80%', '--duration': '20s', animationDelay: '1s' }}></div>
                    </div>

                    {/* Top Banner */}
                    <div className="fixed top-0 w-full h-10 bg-[#0f172a] z-[60] flex items-center justify-between px-8 overflow-hidden">
                        <span className="text-[9px] md:text-[10px] font-bold text-blue-400 uppercase tracking-[0.2em] whitespace-nowrap">
                             SUSTENTABILIDAD CORPORATIVA & ESG
                        </span>
                        <div className="flex items-center space-x-4 opacity-60 grayscale hover:grayscale-0 transition-all duration-500 overflow-x-auto no-scrollbar">
                            {['ODS 6', 'ODS 11', 'ODS 13', 'AGENDA 2030'].map((cert, i) => (
                                <div key={i} className="flex items-center space-x-1 flex-shrink-0">
                                    <div className="w-1 h-3 bg-blue-500"></div>
                                    <span className="text-[9px] font-bold text-white tracking-widest uppercase">{cert}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Desktop Navigation */}
                    <nav className="fixed left-0 w-full z-50 px-6 md:px-8 py-4 flex justify-between items-center glass shadow-sm transition-all top-[40px]">
                        <a href="https://themeyer.eu" className="block z-50">
                            <img src="https://raw.githubusercontent.com/cypher-the-meyer/themeyer.eu/main/themeyerlogo" alt="The Meyer Logo" className="h-10 md:h-12 w-auto object-contain" />
                        </a>
                        
                        <div className="hidden md:flex space-x-8 text-sm font-semibold tracking-widest uppercase opacity-60">
                            <a href="/pages/hardware" className="hover:text-blue-600 transition-colors">Hardware</a>
                            <a href="/pages/software" className="hover:text-blue-600 transition-colors">Software</a>
                            <a href="/pages/about" className="hover:text-blue-600 transition-colors">About Us</a>
                        </div>

                        <div className="flex items-center space-x-4">
                            <button 
                                onClick={() => document.getElementById('form-section').scrollIntoView({ behavior: 'smooth' })} 
                                className="hidden sm:block bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-full text-sm font-bold transition-all transform hover:scale-105 shadow-md"
                            >
                                CONTACTO
                            </button>
                            
                            <button onClick={toggleMenu} className={`md:hidden flex flex-col justify-center items-center w-10 h-10 space-y-1.5 focus:outline-none z-[110] ${isMobileMenuOpen ? 'menu-open' : ''}`}>
                                <span className="block w-6 h-0.5 bg-gray-900 transition-transform duration-300" id="line1"></span>
                                <span className="block w-6 h-0.5 bg-gray-900 transition-opacity duration-300" id="line2"></span>
                                <span className="block w-6 h-0.5 bg-gray-900 transition-transform duration-300" id="line3"></span>
                            </button>
                        </div>
                    </nav>
                        
                    {/* Mobile Menu Overlay - Refactored Fix */}
                    <div className={`fixed inset-0 bg-white/95 backdrop-blur-xl z-[100] md:hidden flex flex-col items-center justify-center space-y-8 transition-all duration-500 ease-in-out ${isMobileMenuOpen ? 'opacity-100 translate-x-0' : 'opacity-0 translate-x-full pointer-events-none'}`}>
                        
                        {/* Close Button Inside Overlay */}
                        <button 
                            onClick={toggleMenu} 
                            className="absolute top-10 right-8 p-2 text-gray-900 hover:text-blue-600 transition-colors focus:outline-none"
                            aria-label="Cerrar menú"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>

                        <a href="/pages/hardware.html" className="text-2xl font-bold uppercase hover:text-blue-600" onClick={toggleMenu}>Hardware</a>
                        <a href="/pages/software.html" className="text-2xl font-bold uppercase hover:text-blue-600" onClick={toggleMenu}>Software</a>
                        <a href="/pages/about.html" className="text-2xl font-bold uppercase hover:text-blue-600" onClick={toggleMenu}>About us</a>
                        <button 
                            onClick={() => { toggleMenu(); document.getElementById('form-section')?.scrollIntoView({ behavior: 'smooth' }); }} 
                            className="bg-blue-600 text-white px-10 py-4 rounded-full text-lg font-bold shadow-xl mt-4 active:scale-95 transition-transform"
                        >
                            CONTACTO
                        </button>
                    </div>

                    <main className="pt-48 pb-20 relative z-10">
                        {children}
                    </main>
                </div>
            );
        };


        const SoftwareSection = () => {
            const titleRef = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('reveal-active');
                        }
                    });
                }, { threshold: 0.1 });

                if (titleRef.current) observer.observe(titleRef.current);
                return () => observer.disconnect();
            }, []);

            return (
                <section className="bg-white py-32 px-6 md:px-20 relative z-20 overflow-hidden">
                    <div className="max-w-7xl mx-auto">
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-20 items-center">
                            <div className="order-2 lg:order-1">
                                <h2 
                                    ref={titleRef}
                                    className="text-5xl md:text-7xl font-black text-gray-900 tracking-tighter mb-8 leading-tight reveal-blur"
                                >
                                    Software que <br/>
                                    <span className="text-blue-600">Escala Realidades</span>
                                </h2>
                                <div className="space-y-6 text-lg text-gray-600 leading-relaxed max-w-xl">
                                    <p>
                                        En <span className="font-bold text-gray-900">The Meyer</span>, el desarrollo de software no es solo escribir código; es ingeniería de precisión. Diseñamos ecosistemas digitales robustos que actúan como el sistema nervioso de su empresa.
                                    </p>
                                    <p className="opacity-80">
                                        Desde arquitecturas de microservicios hasta interfaces de usuario de alta fidelidad, nuestras soluciones están construidas para soportar el tráfico global mientras mantienen una latencia mínima y una seguridad impenetrable.
                                    </p>
                                    <div className="pt-6">
                                        <button className="flex items-center gap-3 font-bold text-blue-600 group transition-all">
                                            VER STACK TECNOLÓGICO
                                            <svg className="w-5 h-5 transform group-hover:translate-x-2 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div className="order-1 lg:order-2 relative">
                                <div className="absolute -inset-4 bg-blue-600/5 rounded-[4rem] blur-2xl"></div>
                                <img 
                                    src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&q=80&w=1200" 
                                    alt="Software Development" 
                                    className="relative rounded-[3rem] shadow-2xl object-cover aspect-[4/3] w-full border border-gray-100"
                                    onError={(e) => {
                                        e.target.onerror = null;
                                        e.target.src='https://via.placeholder.com/1200x900?text=Software+Development'
                                    }}
                                />
                                <div className="absolute -bottom-6 -left-6 bg-white p-6 rounded-3xl shadow-xl border border-gray-50 flex items-center gap-4 max-w-[200px]">
                                    <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold">99%</div>
                                    <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest leading-tight">Uptime en despliegues</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const Layout = ({ children }) => {
            return (
                <div className="relative min-h-screen w-full sticky-container">
                    <div className="bubble-bg">
                        <div className="bubble" style={{ width: '300px', height: '300px', left: '10%', '--duration': '15s' }}></div>
                        <div className="bubble" style={{ width: '200px', height: '200px', left: '60%', '--duration': '12s', animationDelay: '2s' }}></div>
                    </div>

                    <div className="fixed top-0 w-full h-10 bg-[#0f172a] z-[60] flex items-center justify-between px-4 md:px-8">
                        <div className="flex items-center space-x-3">
                            <span className="text-[9px] font-bold text-blue-400 tracking-[0.2em]">THE MEYER</span>
                            <LanguageFlag />
                        </div>
                        <div className="hidden md:flex space-x-6 opacity-60">
                            {['ISO 27001', 'ISO 9001', 'PCI DSS'].map((c, i) => (
                                <span key={i} className="text-[9px] font-bold text-white tracking-widest">{c}</span>
                            ))}
                        </div>
                    </div>

                    <nav className="fixed left-0 w-full z-50 px-4 md:px-8 py-4 flex justify-between items-center glass transition-all top-[40px]">
                        <div className="font-black text-2xl tracking-tighter text-slate-900">THE MEYER</div>
                        <div className="hidden md:flex space-x-8 text-sm font-semibold tracking-widest uppercase opacity-60">
                            <a href="#" className="hover:text-blue-600">Hardware</a>
                            <a href="#" className="hover:text-blue-600">Software</a>
                            <a href="#" className="hover:text-blue-600">About US</a>
                        </div>
                        <button className="bg-blue-600 text-white px-6 py-2 rounded-full text-sm font-bold shadow-md hover:bg-blue-700">CONTACTO</button>
                    </nav>

                    <main className="pt-32">{children}</main>

                    <footer className="py-12 border-t border-gray-200 text-center text-gray-400 text-sm font-semibold tracking-widest bg-white relative z-20">
                        &copy; 2026 THE MEYER EU. TODOS LOS DERECHOS RESERVADOS.
                    </footer>
                </div>
            );
        };

        const App = () => {
            useEffect(() => {
                gsap.registerPlugin(ScrollTrigger);
                gsap.from("#hero-content", { duration: 1.5, y: 50, opacity: 0, ease: "power4.out" });
            }, []);

            return (
                <Layout>
                    <section className="min-h-[80vh] flex flex-col items-center justify-center px-4 text-center relative overflow-hidden">
                        <div id="hero-content" className="relative z-10">
                            <div className="inline-block mb-8 px-5 py-1.5 border border-blue-200 text-blue-600 text-[10px] font-bold rounded-full tracking-[0.5em] uppercase bg-blue-50/50">
                                EST. 2026 | TECH FIRM
                            </div>
                            <h1 className="text-6xl md:text-[10rem] font-black text-gray-900 tracking-tighter mb-10 leading-[0.85]">
                                LA NUEVA <br/><span className="text-blue-600">ERA DIGITAL</span>
                            </h1>
                            <p className="text-xl md:text-2xl text-gray-500 max-w-3xl mx-auto mb-16 font-medium">
                                Infraestructura blindada con tecnología de grado industrial.
                            </p>
                            <div className="flex flex-col sm:flex-row items-center justify-center gap-6">
                                <button className="px-10 py-5 bg-blue-600 text-white font-black rounded-full shadow-2xl hover:scale-105 transition-all uppercase tracking-widest text-xs">Explorar Soluciones</button>
                            </div>
                        </div>
                        <div className="absolute bottom-10 animate-bounce opacity-20">
                            <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 14l-7 7-7-7" strokeWidth="3"/></svg>
                        </div>
                    </section>

                    <CircuitAnimationShowcase />

                    <SoftwareSection />

                    <section className="py-40 bg-slate-900 px-4 relative z-20">
                        <div className="max-w-7xl mx-auto text-center">
                            <h3 className="text-4xl md:text-6xl font-black text-white tracking-tighter mb-20">Certificaciones</h3>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-8">
                                {['🛡️ Security', '💎 Quality', '⚙️ Infra', '💳 Finance'].map((item, idx) => (
                                    <div key={idx} className="p-10 bg-slate-800 border border-slate-700 rounded-[3rem] hover:bg-blue-600 transition-all cursor-default">
                                        <div className="text-4xl mb-4">{item.split(' ')[0]}</div>
                                        <div className="text-white font-bold">{item.split(' ')[1]}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>
                </Layout>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
